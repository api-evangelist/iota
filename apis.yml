- aid: iota:iota-graphql-api
  name: IOTA GraphQL API
  tags:
  - GraphQL
  - Queries
  - Objects
  - Transactions
  - Blockchain
  humanURL: https://docs.iota.org/developer/references/iota-api
  baseURL: https://graphql.mainnet.iota.cafe
  properties:
  - url: https://docs.iota.org/developer/references/iota-api
    type: Documentation
  - url: https://graphql.mainnet.iota.cafe
    type: APIReference
  - url: graphql/iota-graphql.md
    type: GraphQL
  description: >-
    GraphQL RPC interface for the IOTA blockchain, providing an alternative to the JSON-RPC API. Supports
    querying transaction blocks, objects, checkpoints, events, and on-chain state using GraphQL query
    syntax. Available on all IOTA networks including Mainnet at graphql.mainnet.iota.cafe, Testnet at
    graphql.testnet.iota.cafe, and Devnet at graphql.devnet.iota.cafe. Cursor-based pagination is supported
    for list operations.
